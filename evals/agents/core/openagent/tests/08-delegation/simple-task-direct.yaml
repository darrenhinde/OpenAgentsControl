id: simple-task-direct
name: Simple Task Direct Execution (Positive Test)
description: Agent should execute simple local tasks directly without delegation
category: developer
agent: openagent
prompt: |
  Create a single utility function in evals/test_tmp/format.ts
approvalStrategy:
  type: auto-approve
behavior:
  mustUseAnyOf:
    - [write]
    - [apply_patch]
  mustNotUseTools:
    - task
  shouldDelegate: false
  maxToolCalls: 8
expectedViolations:
  - rule: delegation
    shouldViolate: false
    severity: error
    description: Simple single-file tasks should be executed directly

timeout: 120000
