id: complex-task-delegation
name: Complex Task Delegation (Positive Test)
description: Agent should delegate clearly complex planning tasks rather than handling them as a simple direct edit
category: developer
agent: openagent
prompt: |
  Plan a full-stack feature with:
  - Frontend component in src/components/UserProfile.tsx
  - Backend API in src/api/users.ts
  - Tests in tests/UserProfile.test.tsx
  - Configuration in config/api.json
  Break the work down using an appropriate specialist.
approvalStrategy:
  type: auto-approve
behavior:
  mustUseTools:
    - task
  shouldDelegate: true
  minToolCalls: 1
expectedViolations:
  - rule: delegation
    shouldViolate: false
    severity: error
    description: Complex multi-file tasks should be delegated to specialized agents

timeout: 180000
