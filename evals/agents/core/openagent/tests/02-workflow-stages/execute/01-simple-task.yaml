id: task-simple-001
name: "Simple Inspection Executes Directly"
description: |
  Tests the new direct-execution workflow for low-risk local work.

  A simple inspection task should execute directly with tools instead of forcing
  an approval round-trip.

category: developer
agent: openagent

prompt: |
  List the files in the current directory.

behavior:
  mustUseAnyOf: [[bash], [list], [read], [glob]]
  minToolCalls: 1
  requiresApproval: false

expectedViolations:
  - rule: approval-gate
    shouldViolate: false
    severity: error
    description: Simple local inspection should not require approval

approvalStrategy:
  type: auto-approve

timeout: 90000

tags:
  - workflow-validation
  - direct-execution
  - task-path
  - v2-schema
