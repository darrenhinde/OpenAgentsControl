id: verifier/done-on-green.benign
title: Green tests, done accepted with no extra turn
area: gates
gate: verifier
kind: benign
layer: L2
release: v1.4
runner: host
hosts: [claude-code, opencode-v2, codex]
fixture: ts-single
profile: team
setup:
  - approve: { plan: specs/001-x/plan.md }
script:
  - call: edit
    path: src/a.ts
    old: "export const a = 1;"
    new: "export const a = 1; // ok"
  - call: shell
    command: "npm test"
  - call: done
when_enforced: allowed
outcome:
  - stop_blocks: { count: 0 }
  - session_turns: { max: 3 }
  - no_decision_logged: { gate: verifier, decision: [deny, nudge] }
fp_arm:
  policy: { verify: { commands: { test: "exit 1" } } }
  expect: blocked
today:
  claude-code: { status: pass, ev: O, note: "trivially" }
  opencode-v2: { status: pass, ev: O }
