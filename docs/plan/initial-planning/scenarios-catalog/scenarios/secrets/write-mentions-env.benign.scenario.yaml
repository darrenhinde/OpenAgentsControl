id: secrets/write-mentions-env.benign
title: Writing text or code that mentions .env is not a secrets hit
area: gates
gate: secrets
kind: benign
layer: L2
release: v1.4
runner: host
hosts: [claude-code, opencode-v2, codex]
fixture: ts-single
profile: team
setup:
  - approve: { plan: specs/001-config/plan.md }     # so the intent gate stays out of the way
script:
  - call: write
    path: docs/setup.md
    content: "Copy .env.example to .env and fill in API_URL."
  - call: edit
    path: src/config.ts
    old: "export const config = {};"
    new: "export const config = { apiUrl: process.env.API_URL };"
  - call: shell
    command: "grep -rn process.env src"
  - call: done
when_enforced: allowed
outcome:
  - file_contains: { path: docs/setup.md, text: ".env.example" }
  - file_contains: { path: src/config.ts, text: "process.env.API_URL" }
  - no_decision_logged: { gate: secrets, decision: deny }
fp_arm:
  hook: poc-regex                # the poc hook regex-matches the whole tool input and denies call 1
  expect: blocked
today:
  claude-code: { status: known-red, ref: v1.4, ev: O, note: "poc hook would deny the docs write" }
  opencode-v2: { status: pass, ev: O }
